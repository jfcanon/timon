<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="hsl(var(--hue), 20%, 6%)" />
    <title>Timon</title>
    <style>
      :root {
        --hue: 240;
        --bg: hsl(var(--hue), 20%, 6%);
        --fg: hsl(var(--hue), 15%, 95%);
        --fg-muted: hsl(var(--hue), 10%, 70%);
        --accent: hsl(var(--hue), 85%, 72%);
        --accent-soft: hsl(var(--hue), 85%, 72%, 0.12);
        --border: hsl(var(--hue), 15%, 22%);
        --focus: hsl(var(--hue), 85%, 65%);
        --card: hsl(var(--hue), 18%, 9%);
        --shadow: hsl(var(--hue), 25%, 3%);
        --danger: hsl(0, 80%, 72%);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: hsl(var(--hue), 20%, 97%);
          --fg: hsl(var(--hue), 20%, 10%);
          --fg-muted: hsl(var(--hue), 10%, 38%);
          --accent: hsl(var(--hue), 85%, 45%);
          --accent-soft: hsl(var(--hue), 85%, 45%, 0.12);
          --border: hsl(var(--hue), 15%, 78%);
          --focus: hsl(var(--hue), 85%, 40%);
          --card: hsl(var(--hue), 18%, 99%);
          --shadow: hsl(var(--hue), 25%, 85%);
          --danger: hsl(0, 70%, 45%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .shell {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 3rem 2rem;
        box-shadow: 0 4px 24px var(--shadow);
      }

      .logo {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
        line-height: 1.1;
      }

      .tagline {
        color: var(--fg-muted);
        font-size: 1.125rem;
        margin-bottom: 2rem;
        font-weight: 400;
      }

      .field {
        display: block;
        margin-bottom: 1.25rem;
        text-align: left;
      }

      .field label {
        display: block;
        font-size: 0.9375rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--fg);
      }

      .field input {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .field input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-color: var(--focus);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.75rem 1.5rem;
        background: var(--accent);
        color: var(--bg);
        border: 1px solid var(--accent);
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.15s ease;
      }

      .btn:hover {
        filter: brightness(1.05);
      }

      .btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .btn-ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
        width: auto;
        font-weight: 500;
      }

      .btn-ghost:hover {
        background: var(--accent-soft);
        filter: none;
      }

      .alert {
        margin-bottom: 1.25rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--danger);
        border-radius: 8px;
        color: var(--danger);
        font-size: 0.9375rem;
        background: hsl(0, 80%, 50%, 0.08);
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      .app-header .logo {
        font-size: 2rem;
        margin-bottom: 0;
      }

      .app-body {
        color: var(--fg-muted);
      }

      .health-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--accent-soft);
        color: var(--fg);
        border: 1px solid var(--accent);
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .health-link:hover {
        background: var(--accent);
        color: var(--bg);
      }

      .health-link:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .version {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: var(--fg-muted);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="shell" role="main">
      <!-- Login view -->
      <section id="login-view" aria-labelledby="login-heading">
        <h1 class="logo" id="login-heading">Timon</h1>
        <p class="tagline">Voice-first task manager. Speak, it listens.</p>
        <div id="login-error" class="alert" role="alert" hidden></div>
        <form id="login-form" method="post" action="/api/auth/login" novalidate>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="login-error"
            />
          </div>
          <button class="btn" type="submit" id="login-submit">Sign in</button>
        </form>
      </section>

      <!-- App view (shown after a successful session) -->
      <section id="app-view" aria-labelledby="app-heading" hidden>
        <div class="app-header">
          <h1 class="logo" id="app-heading">Timon</h1>
          <button class="btn btn-ghost" type="button" id="logout-button">Log out</button>
        </div>
        <p class="app-body">You're signed in. Your tasks will appear here.</p>
        <a href="/healthz" class="health-link" aria-label="Check service health">Health check</a>
      </section>

      <p class="version">v0.2.0-auth</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
