# Deploys the worker on every push to master, after a fresh test run in this
# job — hermetic on purpose, so the gate holds even if ci.yml changes.
# Doc-only merges skip it. Requires a `production` environment limited to the
# master branch, holding two secrets:
#   CLOUDFLARE_API_TOKEN   Workers deploy rights on the account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# No secret put steps — secrets (GROQ_API_KEY, TIMON_API_KEY, TZ) already
# live on the worker and persist across deploys.
name: Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy worker
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
