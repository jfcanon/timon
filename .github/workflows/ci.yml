name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  conflict-markers:
    name: Conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect conflict markers
        run: |
          if git grep -nE '^(\u003c\u003c\u003c\u003c\u003c\u003c\u003c|=======|\u003e\u003e\u003e\u003e\u003e\u003e)' -- . ':!*.md.snap'; then
            echo "::error::Conflict markers found in tracked files. Resolve before merging."
            exit 1
          fi
