name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd app && bun install --frozen-lockfile && bun run typecheck && bun run build

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md.snap' ':!*.md' :!node_modules/; then
            echo "::error::Conflict markers found in source files"
            exit 1
          fi